[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-wik"
version = "0.1.0"
description = "Market persona, hidden-flow, regime-transition, and Jev scenario engine"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "shadow_wik"}]
keywords = ["trading", "market-microstructure", "jev", "regime", "personas"]

[project.scripts]
shadow-wik = "shadow_wik.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
