<header class="top">
  <h1>Shadow · 오프닝 60분</h1>
  <p class="meta" id="meta">연결 중…</p>
</header>
<p class="notice"><strong>09:00~09:59 한 가지 모드만 집중합니다.</strong> Jev는 매수 상태/매도 상태와 현재 행동을 추천하고, 실제 주문 결정은 사용자가 합니다. 놓친 상승은 손실이 아니며, 하락한 가격 자체는 기회 근거가 아닙니다.</p>
<section class="control-card">
  <div class="control-head">
    <div>
      <strong>통계 검증 강도</strong>
      <span class="badge warn" id="validationMode">탐색 모드</span>
    </div>
    <strong class="control-value" id="validationValue">0</strong>
  </div>
  <input id="validationSlider" type="range" min="0" max="100" step="1" value="0" aria-label="통계 검증 강도">
  <div class="range-labels"><span>0 · 거래 빈도 우선</span><span>100 · 검증 우선</span></div>
  <p class="small">0은 통계적으로 유의하다는 뜻이 아니라 검증 전 탐색을 허용한다는 뜻입니다. 값을 올리면 Jev 최소 확률과 누적 paper evidence 기준이 함께 강화됩니다.</p>
</section>
<section class="portfolio-card" id="portfolio"></section>
